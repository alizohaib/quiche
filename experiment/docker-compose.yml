# QUIX Experiment: Full IPv6 address-hopping MASQUE proxy
#
# Network topology:
#   quix-net (fd00:abcd::/64):
#     - masque-server: fd00:abcd::2 (listens on :4433)
#     - masque-client: fd00:abcd::3 (connects to server, proxies to external)
#
# The server advertises preferred addresses in the fd00:abcd::/64 subnet
# and sends SPA frames to hop within that prefix.

services:
  masque-server:
    image: quix-experiment
    container_name: quix-server
    hostname: quix-server
    networks:
      quix-net:
        ipv6_address: "fd00:abcd::2"
    cap_add:
      - NET_ADMIN
    command: >
      masque_server
        --certificate_file=/certs/cert.pem
        --key_file=/certs/key.pem
        --port=4433
        --preferred_addr=fd00:abcd::2
        --server_ipv6_hopping=true
        --send_spa_frames_every_n_packets=10
        --preferred_addr_prefix=64
        --enable_wf_defense=false
        -v=1
        --stderrthreshold=0
    healthcheck:
      test: ["CMD-SHELL", "ss -uln | grep -q 4433"]
      interval: 2s
      timeout: 5s
      retries: 10

  masque-client:
    image: quix-experiment
    container_name: quix-client
    hostname: quix-client
    networks:
      quix-net:
        ipv6_address: "fd00:abcd::3"
    cap_add:
      - NET_ADMIN
    depends_on:
      masque-server:
        condition: service_healthy
    entrypoint: /experiment/run-client.sh

networks:
  quix-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd00:abcd::/64"
          gateway: "fd00:abcd::1"
